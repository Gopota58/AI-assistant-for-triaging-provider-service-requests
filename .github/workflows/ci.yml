name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Train ML triage on synthetic data
        run: python -m isp_triage.cli train
      - name: Evaluate
        run: python -m isp_triage.cli evaluate
      - name: Pipeline smoke demo
        run: python -m isp_triage.cli demo -n 5
      - name: Tests
        run: pytest
